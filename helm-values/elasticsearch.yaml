---
# Values for elastic/eck-elasticsearch 0.20.0 (pinned in scripts/install.sh).
# Needs the ECK operator (helm-values/eck-operator.yaml) running first.
#
# Resulting objects (namespace "logging"):
#   Elasticsearch "logs"            -> Service logs-es-http:9200 (TLS, self-signed by ECK)
#   Secret logs-es-elastic-user     -> superuser password (break-glass only)
#   Secret logs-es-http-certs-public -> CA that Fluent Bit and the exporter trust
fullnameOverride: logs
version: 9.5.0

# Least-privilege users for the pipeline. Their passwords are generated by
# scripts/install.sh into basic-auth Secrets; role definitions are below (extraObjects).
auth:
  fileRealm:
    - secretName: fluent-bit-es-credentials
    - secretName: es-exporter-credentials
  roles:
    - secretName: logging-es-roles

nodeSets:
  - name: default
    # Three master-eligible data nodes: survives one node or zone loss and keeps quorum.
    count: 3
    config:
      node.roles: ["master", "data", "ingest"]
      # Avoids having to raise vm.max_map_count on every node, at some cost in
      # search performance. Fine for log workloads; revisit for heavy querying.
      node.store.allow_mmap: false
    podTemplate:
      spec:
        containers:
          - name: elasticsearch
            # Heap is sized automatically to half of the memory limit.
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
              limits:
                memory: 4Gi
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                elasticsearch.k8s.elastic.co/cluster-name: logs
    volumeClaimTemplates:
      - metadata:
          name: elasticsearch-data  # ECK requires this exact name
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

# Objects rendered alongside the Elasticsearch resource. Each entry is a template string.
extraObjects:
  # Role definitions for the file-realm users. Not secret, but ECK reads roles from a Secret.
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: logging-es-roles
    type: Opaque
    stringData:
      roles.yml: |-
        fluent_bit_writer:
          indices:
            - names: ["k8s-*"]
              privileges: ["create_index", "index"]
        es_exporter:
          cluster: ["monitor"]

  # Retention and index settings, applied by the bootstrap Job below.
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: logs-es-bootstrap
    data:
      ilm-policy.json: |-
        {
          "policy": {
            "phases": {
              "hot": {
                "min_age": "0ms",
                "actions": { "set_priority": { "priority": 100 } }
              },
              "delete": {
                "min_age": "7d",
                "actions": { "delete": {} }
              }
            }
          }
        }
      index-template.json: |-
        {
          "index_patterns": ["k8s-*"],
          "priority": 200,
          "template": {
            "settings": {
              "index.number_of_shards": 1,
              "index.number_of_replicas": 1,
              "index.refresh_interval": "30s",
              "index.lifecycle.name": "k8s-logs",
              "index.mapping.total_fields.limit": 2000,
              "index.mapping.ignore_malformed": true
            },
            "mappings": {
              "dynamic_templates": [
                {
                  "strings_as_keyword": {
                    "match_mapping_type": "string",
                    "mapping": { "type": "keyword", "ignore_above": 2048 }
                  }
                }
              ],
              "properties": {
                "@timestamp": { "type": "date" },
                "log": { "type": "text" },
                "message": { "type": "text" }
              }
            }
          }
        }

  # Idempotent PUTs of the ILM policy and index template after every install/upgrade.
  # Waits for the cluster, so run helm with a generous --timeout (install.sh uses 20m).
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: logs-es-bootstrap
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              image: curlimages/curl:8.11.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: ES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: logs-es-elastic-user
                      key: elastic
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  es() {
                    curl -sS --fail-with-body --cacert /certs/ca.crt \
                      -u "elastic:${ES_PASSWORD}" -H 'Content-Type: application/json' "$@"
                  }
                  url=https://logs-es-http:9200
                  until es "${url}/_cluster/health?wait_for_status=yellow&timeout=30s" >/dev/null; do
                    echo "waiting for Elasticsearch"; sleep 10
                  done
                  es -X PUT "${url}/_ilm/policy/k8s-logs" --data @/bootstrap/ilm-policy.json
                  echo
                  es -X PUT "${url}/_index_template/k8s-logs" --data @/bootstrap/index-template.json
                  echo
              volumeMounts:
                - name: ca
                  mountPath: /certs
                  readOnly: true
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
          volumes:
            - name: ca
              secret:
                secretName: logs-es-http-certs-public
            - name: bootstrap
              configMap:
                name: logs-es-bootstrap
